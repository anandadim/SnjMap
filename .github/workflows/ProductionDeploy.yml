name: CI/CD Pipeline

# Action ini akan berjalan saat ada push atau merge ke branch 'main'
on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Tests
        run: npm test

  deploy-to-server:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}         
          username: ${{ secrets.SERVER_USER }}     
          key: ${{ secrets.SERVER_SSH_KEY }}       
          port: 22                                 
          script: |
            # 1. Pindah ke direktori proyek Anda di server
            # UBAH PATH INI sesuai dengan lokasi folder proyek Anda di server!
            cd /path/menuju/folder/SnjMap
            
            # 2. Tarik kode terbaru dari GitHub (branch main)
            git pull origin main
            
            # 3. Instal update dependensi (jika ada perubahan di package.json)
            npm install
            
            # 4. Restart aplikasi di PM2
            # Ganti 'snjmap-app' dengan nama aplikasi PM2 Anda saat ini
            pm2 restart snjmap-app 
            
            # 5. Simpan status PM2 agar otomatis jalan jika server mati/reboot
            pm2 save
